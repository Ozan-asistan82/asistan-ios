name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri Indir
        run: flutter pub get

      - name: CocoaPods Kur
        run: |
          cd ios
          pod install
          cd ..

      - name: Xcode Imzasiz Archive Olustur
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath build/ios/Runner.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: IPA Paketi Olustur
        run: |
          mkdir -p Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r Asistan-iOS.ipa Payload

      - name: Asistan-iOS.ipa Dosyasini Yayinla
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-iOS-IPA
          path: Asistan-iOS.ipa